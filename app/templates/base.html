<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cybersec SaaS{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .severity-critical { border-left-color: #dc2626; }
    .severity-high { border-left-color: #ea580c; }
    .severity-medium { border-left-color: #d97706; }
    .severity-low { border-left-color: #65a30d; }
    .badge-critical { background-color: #fee2e2; color: #991b1b; }
    .badge-high { background-color: #fed7aa; color: #9c4221; }
    .badge-medium { background-color: #fef3c7; color: #713f12; }
    .badge-low { background-color: #dcfce7; color: #166534; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  {% include "components/flash.html" %}

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm">C</div>
          <span class="font-bold text-xl tracking-tight text-gray-900">Cybersec<span class="text-blue-600">SaaS</span></span>
        </div>
        <div class="flex items-center gap-4">
          {% if user %}
          <a href="/" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors">Panel cliente</a>
          {% if user.is_admin %}
          <a href="/admin" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors">Administrador</a>
          {% endif %}
          <form method="post" action="/logout" class="inline" onsubmit="return confirm('¿Cerrar sesión?')">
            <input type="hidden" name="csrf_token" value="{{ csrf_token or '' }}">
            <button class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">Cerrar sesión</button>
          </form>
          {% else %}
          <a href="/login" class="text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors">Iniciar sesión</a>
          {% endif %}
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 bg-white py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center text-sm text-gray-500">
      <div>Cybersec SaaS · Ciberseguridad para pymes</div>
      <div>Escanea solo objetivos que estés autorizado a auditar</div>
    </div>
  </footer>
</body>
</html>
