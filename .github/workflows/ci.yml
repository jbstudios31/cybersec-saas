name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cybersec
          POSTGRES_PASSWORD: cybersec
          POSTGRES_DB: cybersec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cybersec -d cybersec"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit

      - name: Lint (ruff)
        run: |
          ruff check app worker scanner tests alembic

      - name: Security scan (bandit)
        run: |
          bandit -r app worker scanner -ll -q

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://cybersec:cybersec@localhost:5432/cybersec
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENV: development
          SCAN_ASYNC: "false"
        run: |
          pytest tests/ -v

      - name: Migrations (upgrade / downgrade / upgrade)
        env:
          DATABASE_URL: postgresql+psycopg2://cybersec:cybersec@localhost:5432/cybersec
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cybersec-saas:ci .
      - name: Smoke test (import + health)
        run: |
          docker run --rm -d --name cybersec-ci -e DATABASE_URL=sqlite:////tmp/test.db -e SECRET_KEY=ci-secret cybersec-saas:ci
          for i in $(seq 1 20); do
            if docker exec cybersec-ci curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          docker exec cybersec-ci curl -fsS http://127.0.0.1:8000/ready
          docker rm -f cybersec-ci
